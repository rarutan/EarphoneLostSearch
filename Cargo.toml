[package]
name = "earphone_lost_search"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Gen 7 blink timing assistant for egg RNG workflows"
autobins = false

[[bin]]
name = "EarphoneLostSearch"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
rodio = "0.19"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Threading"] }
