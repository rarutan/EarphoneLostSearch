[package]
name = "hatch_blink_search"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Gen 7 blink timing assistant for egg RNG workflows"

[dependencies]
eframe = "0.29"
egui = "0.29"
rodio = "0.19"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Diagnostics_Debug"] }
